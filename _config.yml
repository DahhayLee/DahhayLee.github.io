# 사이트 기본 설정
title: Dahhay Lee
email: dahhaylee@yonsei.ac.kr
description: >-
  PhD candidate in Computational Science and Engineering, Yonsei University.
  Survival analysis, Bayesian methods, uncertainty quantification.
url: "https://dahhaylee.github.io"
timezone: Asia/Seoul
markdown: kramdown
permalink: /:categories/:title/

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jemoji
  - jekyll-include-cache

author:
  name: "Dahhay Lee"
  avatar: "/assets/images/profilepic.jpg"   # 헤더 사진. 바꾸려면 assets/images 에 올리고 경로 수정
  bio: "PhD candidate, Yonsei University · Survival analysis & Bayesian"
  location: "Seoul, Korea"

# 사이드바 ELSEWHERE 링크. url 이 빈 항목은 표시되지 않아요.
elsewhere:
  - label: "Publications"
    url: "/publications/"
  - label: "ORCID"
    url: ""            # 예: "https://orcid.org/0000-0000-0000-0000"
  - label: "GitHub"
    url: "https://github.com/DahhayLee"
  - label: "Email"
    url: "mailto:dahhaylee@yonsei.ac.kr"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
