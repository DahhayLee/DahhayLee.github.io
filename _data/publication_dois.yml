# 논문 DOI를 한 줄에 하나씩 적으면 Publications 페이지가 자동으로 만들어져요.
# 저장(커밋)하고 1~2분 뒤 사이트에 반영돼요.
#
# - 연도별로 자동 정렬(최신 연도가 위). 같은 연도 안에서는 여기 적은 순서대로.
# - https://doi.org/ 를 붙여 넣어도 알아서 떼어내요.
# - 들여쓰기는 스페이스만 (탭 금지). 맨 앞의 # 을 지우면 그 줄이 적용돼요.
#
# 기본 형식:
 - 10.1016/j.artmed.2026.103457
 - 10.1200/CCI.23.00192
 - 10.3802/jgo.2022.33.e5
#
# 자동으로 가져온 값이 틀리면, 그 필드만 직접 적어서 덮어쓸 수 있어요:
# - doi: 10.1002/sim.12345
#   title: "고친 제목"
#   year: 2025
#
# 잠깐 숨기기:
# - doi: 10.1002/sim.12345
#   hide: true
#
# DOI가 없는 항목은 전부 직접 적기:
# - title: "논문 제목"
#   authors: "Dahhay Lee, Coauthor One"
#   journal: "학술지 이름"
#   year: 2024
#   url: "https://..."