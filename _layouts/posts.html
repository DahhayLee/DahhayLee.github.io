---
layout: default
---
<article class="entry">
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="body">
{{ content }}
  {% assign entries = site.posts | where_exp: "p", "p.link == nil" %}
    <ul class="post-list">
    {% for p in entries %}<li><span class="d">{{ p.date | date: "%Y. %m. %d" }}</span> <a href="{{ p.link | default: p.url | relative_url }}">{{ p.title }}</a></li>
    {% endfor %}
    </ul>
  </div>
</article>
