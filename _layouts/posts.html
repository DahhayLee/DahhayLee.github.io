---
layout: default
---
<article class="entry">
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="body">
{{ content }}
  {% assign entries = site.posts | where_exp: "p", "p.link == nil" %}
    <ul>
    {% for p in entries %}<li><a href="{{ p.url | relative_url }}">{{ p.date | date: "%Y. %m. %d" }}</a> {{ p.title }}</li>{% endfor %}
    </ul>
  </div>
</article>
